  <rect x="43" y="40" width="34" height="23" rx="4" fill="#0A1E4A"/>
  <line x1="43" y1="49" x2="77" y2="49" stroke="#FFFFFF" stroke-width="1.8"/>
  <rect x="57" y="46.5" width="6" height="5.5" rx="1.2" fill="#FFFFFF"/>

  <!-- Golden Swoosh Crescent -->
