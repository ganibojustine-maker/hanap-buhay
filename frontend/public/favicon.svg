      <stop offset="0%" stop-color="#FFD043"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A1E4A"/>
    </linearGradient>
  </defs>

  <!-- Speed Lines -->
  <rect x="2"  y="44" width="22" height="5" rx="2.5" fill="#2563EB"/>
  <rect x="0"  y="54" width="28" height="6" rx="3" fill="#1D4ED8"/>
  <rect x="6"  y="65" width="20" height="5" rx="2.5" fill="#2563EB"/>

  <!-- Magnifying Glass Ring -->
  <circle cx="60" cy="56" r="34" fill="none" stroke="url(#favNavy)" stroke-width="8"/>

