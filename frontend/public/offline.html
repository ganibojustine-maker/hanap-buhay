<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#092866" />
  <title>Offline · hanapbuhay</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #0D1B3E; color: #fff; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { max-width: 380px; }
    img { width: 84px; height: 84px; border-radius: 20px; background: #fff; padding: 8px; }
    h1 { font-size: 22px; margin: 18px 0 8px; letter-spacing: -.02em; }
    p { margin: 0 0 8px; color: rgba(255,255,255,.75); }
    button { margin-top: 18px; height: 48px; padding: 0 26px; border: 0; border-radius: 12px; background: #F5A623; color: #0D1B3E;
      font: 700 15px system-ui, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Walang internet</h1>
    <p>You're offline. Check your data or Wi-Fi, then try again.</p>
    <p>Pages you opened before still work offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
