services:
  # ── 1. Backend Web Service (PHP 8.2 Apache + MySQL) ────────────────
  - type: web
    name: hanapbuhay-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: HANAPBUHAY
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: mysql
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: certs/aiven-ca.pem
      - key: DB_NAME
        value: hanapbuhay
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_FRONTEND_URL
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # optional: SMS to workers (empty = texts only logged) and the reminder pinger secret
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PAYMONGO_METHODS
        value: card,gcash,paymaya,grab_pay,qrph
      - key: FIREBASE_DATABASE_URL
        sync: false
      # pending database migrations run when the container starts (backend/docker-start.sh)
      - key: RUN_MIGRATIONS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # keep the database connection open between requests (no TLS handshake each time)
      - key: DB_PERSISTENT
        value: "true"
      - key: MAIL_FROM_ADDRESS
        value: ganibojustine@gmail.com
      - key: MAIL_FROM_NAME
        value: "HanapBuhay Oriental Mindoro"

  # ── 2. Frontend Static Site (React + Vite) ─────────────────────────
  - type: web
    name: hanapbuhay-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Security headers on every page (Unit 6: X-Frame-Options, nosniff, Referrer-Policy, HTTPS only)
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(self), microphone=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Service worker and manifest must always be re-checked so app updates reach phones
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Built files have a content hash in their name: safe to cache for a year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
